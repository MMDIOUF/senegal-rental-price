services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      MODEL_PATH: /app/models/random_forest.joblib
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

