[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senegal-rental-price"
version = "1.0.0"
description = "Service MLOps de prediction des loyers au Senegal"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "hydra-core>=1.3,<2",
  "joblib>=1.4,<2",
  "mlflow-skinny>=3.14,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
frontend = [
  "streamlit>=1.39,<2",
]
dev = [
  "black>=24.10,<26",
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pandas-stubs>=2.2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "streamlit>=1.39,<2",
  "types-requests>=2.32",
]

[project.scripts]
senegal-rental-train = "senegal_rental_price.models.train:main"
senegal-rental-generate-data = "senegal_rental_price.data.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_documents.py" = ["E501"]
"frontend/app.py" = ["E501"]
"notebooks/*.ipynb" = ["E501", "I001"]
"tutorial/runner.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.coverage.run]
source = ["senegal_rental_price"]
omit = ["*/models/train.py", "*/data/generate.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
