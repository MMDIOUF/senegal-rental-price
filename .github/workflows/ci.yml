name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: black --check .
      - name: Type check
        run: mypy --strict src/
      - name: Run tests with coverage
        run: pytest --cov=src --cov-fail-under=70

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6
      - name: Prepare API image build context
        run: mkdir -p models && touch models/gradient_boosting.joblib
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t senegal-rental-api:ci .
